[project]
name = "sub-webhook"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "oxunjonabdulla", email = "coderoxunjon50@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
sub-webhook = "sub_webhook:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
